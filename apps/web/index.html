<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0c0e" />
    <title>THIN ICE</title>
    <meta
      name="description"
      content="Same entry for everyone, same ice for everyone. Twice a second the field is tested — cash out before it tests you. Provably fair, player-vs-player."
    />

    <!-- The tab icon is the in-app wordmark's own glyph, not a separate mark:
         cyan tile, hollow hex. SVG first (crisp at any tab/pinned size in
         every current browser), PNG fallbacks behind it for the handful of
         contexts that still want a raster — old Safari, Windows shortcuts,
         search-result favicons. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- Link previews (Discord, Telegram, X): a chat full of "same entry,
         same ice" text links is dead weight next to one that shows the
         wordmark and the pitch. Card matches the product's own palette and
         type, not a generic screenshot. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="THIN ICE" />
    <meta property="og:title" content="THIN ICE" />
    <meta
      property="og:description"
      content="Same entry for everyone, same ice for everyone. Twice a second the field is tested — cash out before it tests you."
    />
    <meta property="og:image" content="https://www.voidsolana.com/thin-ice/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="THIN ICE" />
    <meta
      name="twitter:description"
      content="Same entry for everyone, same ice for everyone. Twice a second the field is tested — cash out before it tests you."
    />
    <meta name="twitter:image" content="https://www.voidsolana.com/thin-ice/og-card.png" />

    <!-- The faces are ours and same-origin (see the @font-face block in
         styles.css). Preloaded here are the three that carry the first paint:
         the display variable font behind all chrome, the mono weight every
         caption is set in, and the mono weight the multiplier is set in. The
         other two weights appear below the fold and can arrive with the CSS.
         crossorigin is required even same-origin — fonts are always fetched in
         anonymous CORS mode, and without it the preload is discarded and
         fetched a second time. -->
    <link
      rel="preload"
      href="./fonts/oxanium-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/ibm-plex-mono-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/ibm-plex-mono-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
